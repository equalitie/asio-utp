stages:
  - build

.build:
  tags:
    - docker
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    # Install dependencies
    - apt update && apt install -y
      build-essential
      cmake
      git
      zlib1g-dev
      wget

    # Build boost
    - boost="boost_"$BOOST_MAJOR"_"$BOOST_MINOR"_"$BOOST_PATCH
    - wget "https://boostorg.jfrog.io/artifactory/main/release/"$BOOST_MAJOR"."$BOOST_MINOR"."$BOOST_PATCH"/source/"$boost".tar.bz2"
    - tar -xjf $boost".tar.bz2"
    - cd $boost
    - ./bootstrap.sh
    - ./b2 -j3 -d+0 --link=static --with-system --with-test --with-coroutine
    - cd ..

    # Build asio-utp
    - cmake -S ./ -B build/asio-utp
      -DBOOST_ROOT=$CI_PROJECT_DIR"/"$boost
      -DASIO_UTP_WITH_TESTS=ON
      -DASIO_UTP_WITH_EXAMPLES=OFF
      -DASIO_UTP_DEBUG_LOGGING=OFF
      -DUTP_DEBUG_LOGGING=OFF
    - cmake --build build/asio-utp
    - export LD_LIBRARY_PATH=$CI_PROJECT_DIR/$boost/stage/lib:$LD_LIBRARY_PATH

    # Run the tests
    - ./build/asio-utp/test-comm
    - ./build/asio-utp/test-util

    # Run the benchmark
    - ./build/asio-utp/test-bench server utp 127.0.0.1:6789&
    - ./build/asio-utp/test-bench client utp 127.0.0.1:6789

boost-1.71:
  extends: ".build"
  image: debian:buster
  variables:
     BOOST_MAJOR: "1"
     BOOST_MINOR: "71"
     BOOST_PATCH: "0"

boost-1.74:
  extends: ".build"
  image: debian:bookworm
  variables:
    BOOST_MAJOR: "1"
    BOOST_MINOR: "74"
    BOOST_PATCH: "0"

boost-1.77:
  extends: ".build"
  image: debian:bookworm
  variables:
    BOOST_MAJOR: "1"
    BOOST_MINOR: "77"
    BOOST_PATCH: "0"

boost-1.79:
  extends: ".build"
  image: debian:bookworm
  variables:
    BOOST_MAJOR: "1"
    BOOST_MINOR: "79"
    BOOST_PATCH: "0"
